<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Império Logística — App de campo</title><style>
:root{--ground:#f8faf7;--surface:#fff;--ink:#22302a;--muted:#64716b;--line:#d9dfdc;--purple:#5b4bcc;--purple-soft:#f0edfb;--green:#237452;--sage:#edf3ee;--amber:#8a5a00;--amber-soft:#fff7e6}*{box-sizing:border-box}body{margin:0;background:#e7ece8;color:var(--ink);font:15px/1.45 "Avenir Next",Avenir,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}a,button{color:inherit;font:inherit}a{text-decoration:none}button{cursor:pointer}h1,h2,h3,p,figure{margin:0}.phone{background:var(--ground);margin:auto;max-width:430px;min-height:100vh;padding-bottom:78px}.top{align-items:center;background:var(--surface);border-bottom:1px solid var(--line);display:flex;height:62px;justify-content:space-between;padding:0 17px;position:sticky;top:0;z-index:4}.brand{font-size:16px;font-weight:800;letter-spacing:.04em}.mode{color:var(--muted);font-size:12px;text-align:right}.mode b{color:var(--amber);display:block}.demo{background:var(--amber-soft);border-bottom:1px solid #ecd49d;color:#73530e;font-size:12px;padding:8px 14px;text-align:center}.content{padding:20px 17px}.with-action{padding-bottom:178px}.back{color:var(--purple);display:inline-block;font-size:13px;font-weight:750;margin-bottom:18px}.head h1{font-size:27px;letter-spacing:-.025em;line-height:1.12}.head p{color:var(--muted);font-size:13px;margin-top:7px}.notice{background:var(--amber-soft);border:1px solid #ecd49d;border-radius:12px;margin-top:18px;padding:14px}.notice strong{color:var(--amber);display:block;font-size:13px}.notice p{color:#705f3d;font-size:12px;margin-top:5px}.operation-list{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:15px;overflow:hidden}.call{align-items:center;border-bottom:1px solid var(--line);display:grid;gap:12px;grid-template-columns:48px minmax(0,1fr) auto;min-height:76px;padding:12px 14px}.call:last-child{border-bottom:0}.call time{font-size:13px;font-weight:800}.call h2{font-size:14px}.call p{color:var(--muted);font-size:12px;margin-top:3px}.call b{color:var(--purple);font-size:22px}.route-window{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:18px;overflow:hidden}.route-title{border-bottom:1px solid var(--line);font-size:14px;padding:13px 14px}.route{display:flex;gap:8px;overflow-x:auto;padding:22px 14px}.stage{background:transparent;border:0;flex:0 0 88px;padding:0;text-align:center}.node{background:var(--surface);border:2px solid var(--line);border-radius:50%;display:grid;height:44px;margin:auto;place-items:center;width:44px}.stage.done .node{border-color:var(--green);color:var(--green)}.stage.active .node{background:var(--purple);border-color:var(--purple);box-shadow:0 0 0 5px var(--purple-soft);color:#fff}.stage.selected .node{border-color:var(--purple)}.node svg{fill:none;height:20px;stroke:currentColor;stroke-width:1.8;width:20px}.stage h3{font-size:12px;margin-top:9px}.stage time{color:var(--muted);font-size:12px}.stage.active h3{color:var(--purple)}.context-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:14px}.context{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}.context img{display:block;height:86px;object-fit:cover;width:100%}.context-body{padding:11px}.context strong{display:block;font-size:13px}.context span{color:var(--muted);display:block;font-size:12px;margin-top:2px}.crew{display:flex;height:86px}.crew span{background-image:url(assets/demo-team-contact-sheet.png);background-size:200% 200%;flex:1}.crew .p1{background-position:0 0}.crew .p2{background-position:100% 0}.crew .p3{background-position:0 100%}.section{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}.section>h2{font-size:14px;padding:14px}.progress{background:var(--sage);border-top:1px solid var(--line);height:5px}.progress i{background:var(--green);display:block;height:100%;width:50%}.task{align-items:center;border-top:1px solid var(--line);display:grid;gap:11px;grid-template-columns:34px minmax(0,1fr);min-height:68px;padding:10px 14px;text-align:left;width:100%}.task button{background:transparent;border:0;display:contents}.check{border:2px solid var(--amber);height:26px;position:relative;width:26px}.task.done .check{background:var(--green);border-color:var(--green)}.task.done .check:after{border:solid white;border-width:0 2px 2px 0;content:"";height:11px;left:7px;position:absolute;top:3px;transform:rotate(45deg);width:5px}.task strong{display:block;font-size:13px}.task span{color:var(--muted);display:block;font-size:12px;margin-top:3px}.evidence{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:14px;padding:14px}.evidence h2{font-size:14px}.evidence p{color:var(--muted);font-size:12px;margin-top:4px}.capture-grid{display:grid;gap:9px;grid-template-columns:1fr 1fr;margin-top:13px}.capture{background:var(--sage);border:0;border-radius:10px;min-height:92px;padding:12px;text-align:left}.capture svg{fill:none;height:23px;stroke:var(--green);stroke-width:1.8;width:23px}.capture strong{display:block;font-size:13px;margin-top:8px}.capture span{color:var(--muted);display:block;font-size:12px;margin-top:2px}.gallery{display:grid;gap:8px;grid-template-columns:repeat(2,1fr);margin-top:14px}.gallery figure{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}.gallery img{display:block;height:128px;object-fit:cover;width:100%}.gallery figcaption{font-size:12px;padding:9px}.signal-row{background:var(--surface);border-bottom:1px solid var(--line);display:grid;gap:10px;grid-template-columns:35px 1fr auto;padding:13px 14px}.signal-row:last-child{border-bottom:0}.signal-row svg{fill:none;height:24px;stroke:var(--green);stroke-width:1.8;width:24px}.signal-row strong{display:block;font-size:13px}.signal-row span,.signal-row small{color:var(--muted);font-size:12px}.queue{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:15px;overflow:hidden}.queue-item{border-bottom:1px solid var(--line);padding:14px}.queue-item:last-child{border-bottom:0}.queue-item b{color:var(--amber);float:right;font-size:12px}.queue-item strong{display:block;font-size:13px}.queue-item span{color:var(--muted);font-size:12px}.action{background:var(--purple);border:0;bottom:55px;color:#fff;left:50%;max-width:430px;padding:14px 18px calc(14px + env(safe-area-inset-bottom));position:fixed;text-align:left;transform:translateX(-50%);width:100%;z-index:5}.action span{display:block;font-size:12px}.action strong{display:flex;font-size:18px;justify-content:space-between}.action strong:after{content:"›";font-size:23px}.bottom{background:var(--surface);border-top:1px solid var(--line);bottom:0;display:grid;grid-template-columns:repeat(3,1fr);left:50%;max-width:430px;position:fixed;transform:translateX(-50%);width:100%;z-index:6}.bottom a{font-size:12px;padding:17px 5px;text-align:center}.bottom a.active{color:var(--purple);font-weight:800}::selection{background:#d9d2ff}*:focus-visible{outline:3px solid #9d91df;outline-offset:2px}@media(min-width:700px){.phone{box-shadow:0 18px 60px rgba(34,48,42,.15)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><!-- Prototype demonstrativo: nenhuma ação é persistida ou enviada. --><main class="phone"><header class="top"><a class="brand" href="?screen=home">IMPÉRIO</a><div class="mode"><b>MODO DEMONSTRAÇÃO</b>App de campo</div></header><div class="demo">Dados e imagens de exemplo · nada é salvo ou sincronizado</div><div id="content"></div><nav class="bottom"><a data-nav="home" href="?screen=home">Hoje</a><a data-nav="evidence" href="?screen=evidence">Evidências</a><a data-nav="sync" href="?screen=sync">Fila local</a></nav></main><script>
const stages=[
{id:"preparation",label:"Preparação",time:"08:00",icon:"M4 7h16v12H4zM8 7V4h8v3",intro:"Deixe pedido, equipe e carga prontos para sair.",tasks:[["Conferir pedido e separação","Checklist por grupo de itens"],["Confirmar equipe escalada","Todas as pessoas presentes"],["Vincular veículo e motorista","Veículo correto para a carga"],["Registrar divergências","Foto e observação quando necessário"]]},
{id:"departure",label:"Saída",time:"08:30",icon:"M3 7h13v10H3zM16 10h3l2 3v4h-5z",intro:"Confirme as pessoas, fotografe a carga e registre a saída.",tasks:[["Confirmar motorista e veículo","VUC 03 · Rafael Costa"],["Confirmar toda a equipe","5 pessoas previstas"],["Tirar foto da carga","Foto ao vivo será obrigatória"],["Registrar GPS e horário","Capturados pelo sistema"]]},
{id:"travel",label:"Deslocamento",time:"09:00",icon:"M4 12h16M15 7l5 5-5 5",intro:"Acompanhe o caminho e registre qualquer desvio.",tasks:[["Iniciar acompanhamento","Última posição e horário"],["Revisar previsão de chegada","ETA demonstrativo"],["Manter contato acessível","Responsável do local"],["Registrar ocorrência","Avaria, atraso ou desvio"]]},
{id:"arrival",label:"Chegada",time:"09:30",icon:"M12 21s6-5 6-11a6 6 0 1 0-12 0c0 6 6 11 6 11z",intro:"Registre onde chegou e se o acesso está liberado.",tasks:[["Registrar chegada por GPS","Local e horário automáticos"],["Confirmar acesso ao local","Liberado ou bloqueado"],["Informar motivo do bloqueio","Obrigatório quando não liberado"],["Iniciar tempo de espera","Cronômetro da ocorrência"]]},
{id:"assembly",label:"Montagem",time:"10:00",icon:"m5 19 6-6M13 11l6-6M15 5h4v4",intro:"Conduza a montagem por checklist e evidências.",tasks:[["Iniciar cronômetro","Tempo real de montagem"],["Conferir itens por grupo","Quantidade e condição"],["Fotografar montagem","Ambientes finalizados"],["Registrar divergência","Falta, troca ou avaria"]]},
{id:"event",label:"Entrega",time:"15:30",icon:"M5 4h14v16H5zM8 9h8M8 13h5",intro:"Formalize a entrega e o aceite do cliente.",tasks:[["Conferir com o cliente","Itens e ambientes"],["Coletar aceite","Assinatura ou confirmação"],["Anexar termo de entrega","Documento da operação"],["Registrar observações","Pendências combinadas"]]},
{id:"disassembly",label:"Desmontagem",time:"18:00",icon:"M4 7h16M7 4v6M17 4v6M6 11h12v9H6z",intro:"Retire, conte e fotografe antes de deixar o local.",tasks:[["Iniciar cronômetro","Tempo de desmontagem"],["Conferir volumes","Retirados do local"],["Fotografar local liberado","Condição de entrega"],["Registrar avaria ou falta","Com responsável"]]},
{id:"return",label:"Retorno",time:"18:30",icon:"M20 11a8 8 0 1 0-2 6M20 4v7h-7",intro:"Acompanhe a volta e confirme a chegada à base.",tasks:[["Confirmar saída do evento","Horário e responsável"],["Acompanhar retorno","Posição e ETA"],["Registrar chegada à base","GPS e horário"],["Separar itens com avaria","Encaminhar para revisão"]]},
{id:"inspection",label:"Conclusão",time:"19:15",icon:"m6 12 4 4 8-9M4 3h16v18H4z",intro:"Finalize a conferência e libere os itens.",tasks:[["Conferir devolução","Checklist de retorno"],["Separar avarias","Foto e encaminhamento"],["Atualizar disponibilidade","Após conferência"],["Encerrar operação","Resumo e responsável"]]}
];
const events={festival:{name:"Festival de Inverno",place:"Parque da Cidade · Portão C",stage:1,team:"Equipe Norte · 4 de 5",vehicle:"VUC 03",status:"2 pendências"},praia:{name:"Show da Praia",place:"Orla Norte · Acesso B",stage:0,team:"Equipe Sul · 6 de 6",vehicle:"Van 02",status:"no prazo"},arena:{name:"Arena Sertaneja",place:"Arena Fonte Nova · Doca 2",stage:0,team:"Equipe Centro · 4 de 5",vehicle:"VUC 01",status:"1 pendência"}},params=new URLSearchParams(location.search),screen=params.get("screen")||"home",stage=params.get("stage")||"departure",eventId=events[params.get("event")]?params.get("event"):"festival",currentEvent=events[eventId];
const route=(selected=stages[currentEvent.stage].id)=>`<section class="route-window"><h2 class="route-title">Toque em uma etapa para ver o que fazer</h2><div class="route">${stages.map((item,index)=>`<a class="stage ${index<currentEvent.stage?"done":""} ${item.id===selected?"active selected":""}" href="?screen=stage&stage=${item.id}&event=${eventId}" aria-label="${item.label}, ${item.time}, ${item.id===selected?"etapa selecionada":index<currentEvent.stage?"concluída":"planejada"}" ${item.id===selected?'aria-current="step"':""}><i class="node"><svg viewBox="0 0 24 24"><path d="${item.icon}"/></svg></i><h3>${item.label}</h3><time>${item.time}</time></a>`).join("")}</div></section>`;
const home=()=>`<div class="content"><div class="head"><h1>Operações de hoje</h1><p>Abra um evento e siga a próxima ação.</p></div><div class="notice"><strong>Festival de Inverno precisa de você</strong><p>Duas confirmações ainda bloqueiam a saída.</p></div><div class="operation-list"><a class="call" href="?screen=operation&event=festival"><time>08:00</time><div><h2>Festival de Inverno</h2><p>Saída · 2 pendências</p></div><b>›</b></a><a class="call" href="?screen=operation&event=praia"><time>11:30</time><div><h2>Show da Praia</h2><p>Preparação · no prazo</p></div><b>›</b></a><a class="call" href="?screen=operation&event=arena"><time>15:00</time><div><h2>Arena Sertaneja</h2><p>Aguardando equipe</p></div><b>›</b></a></div></div>`;
const operation=()=>{const next=stages[currentEvent.stage];return `<div class="content with-action"><a class="back" href="?screen=home">← Operações de hoje</a><div class="head"><h1>${currentEvent.name}</h1><p>${currentEvent.place}</p></div>${route()}<div class="notice"><strong>${next.label} · ${currentEvent.status}</strong><p>Abra a etapa e conclua as confirmações indicadas.</p></div><div class="context-grid"><a class="context" href="?screen=stage&stage=${next.id}&event=${eventId}"><div class="crew"><span class="p1"></span><span class="p2"></span><span class="p3"></span></div><div class="context-body"><strong>${currentEvent.team}</strong><span>Imagens demonstrativas</span></div></a><a class="context" href="?screen=stage&stage=${next.id}&event=${eventId}"><img src="../../../site/public/imperio/hero-operation.png" alt="Imagem demonstrativa do veículo"><div class="context-body"><strong>${currentEvent.vehicle}</strong><span>Veículo da operação</span></div></a></div></div><a class="action" href="?screen=stage&stage=${next.id}&event=${eventId}"><span>Próxima ação</span><strong>Revisar ${next.label.toLowerCase()}</strong></a>`};
const stageScreen=id=>{const selected=stages.find(item=>item.id===id)||stages[currentEvent.stage];return `<div class="content with-action"><a class="back" href="?screen=operation&event=${eventId}">← ${currentEvent.name}</a><div class="head"><h1>${selected.label}</h1><p>${selected.intro}</p></div>${route(selected.id)}<section class="section"><h2>O que precisa ser feito</h2><div class="progress"><i></i></div>${selected.tasks.map((task,index)=>`<div class="task ${index<2?"done":""}"><button type="button" aria-pressed="${index<2}"><i class="check"></i><div><strong>${task[0]}</strong><span>${task[1]}</span></div></button></div>`).join("")}</section><section class="evidence"><h2>Registros desta etapa</h2><p>Os controles abaixo demonstram onde foto e GPS serão capturados.</p><div class="capture-grid"><button class="capture" data-demo="photo"><svg viewBox="0 0 24 24"><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><circle cx="12" cy="13" r="3"/></svg><strong>Tirar foto</strong><span>Abre a câmera no produto real</span></button><button class="capture" data-demo="gps"><svg viewBox="0 0 24 24"><path d="M12 21s6-5 6-11a6 6 0 1 0-12 0c0 6 6 11 6 11z"/><circle cx="12" cy="10" r="2"/></svg><strong>Registrar GPS</strong><span>Local e horário automáticos</span></button></div></section><div class="context-grid"><div class="context"><div class="crew"><span class="p1"></span><span class="p2"></span><span class="p3"></span></div><div class="context-body"><strong>${currentEvent.team}</strong><span>Imagens demonstrativas</span></div></div><div class="context"><img src="../../../site/public/imperio/hero-operation.png" alt="Imagem demonstrativa do veículo"><div class="context-body"><strong>${currentEvent.vehicle}</strong><span>Veículo demonstrativo</span></div></div></div></div><button class="action" id="finish" disabled><span>Conclua todas as tarefas para avançar</span><strong>Concluir ${selected.label.toLowerCase()}</strong></button>`};
const evidence=()=>`<div class="content"><div class="head"><h1>Evidências</h1><p>Fotos, localização e documentos organizados pela etapa.</p></div><div class="gallery"><figure><img src="../../../site/public/imperio/hero-operation.png" alt="Operação demonstrativa"><figcaption>Carga · Saída</figcaption></figure><figure><img src="../../../site/public/imperio/real-corporativo.jpeg" alt="Montagem demonstrativa"><figcaption>Montagem · Ambiente 1</figcaption></figure><figure><img src="../../../site/public/imperio/event-white.jpg" alt="Entrega demonstrativa"><figcaption>Entrega · Foto final</figcaption></figure><figure><img src="../../../site/public/imperio/real-casamento.jpeg" alt="Evento demonstrativo"><figcaption>Desmontagem · Local</figcaption></figure></div><section class="section"><h2>Registros automáticos planejados</h2><div class="signal-row"><svg viewBox="0 0 24 24"><path d="M12 21s6-5 6-11a6 6 0 1 0-12 0c0 6 6 11 6 11z"/></svg><div><strong>GPS da saída</strong><span>Base da Império · exemplo</span></div><small>08:31</small></div><div class="signal-row"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 9h8M8 13h6"/></svg><div><strong>Checklist de carga</strong><span>3 de 4 registros</span></div><small>Pendente</small></div></section></div>`;
const sync=()=>`<div class="content"><div class="head"><h1>Fila local</h1><p>Aqui aparecerão os registros aguardando envio quando a operação estiver sem sinal.</p></div><div class="notice"><strong>Sincronização ainda não implementada</strong><p>Os itens abaixo são somente exemplos de estados futuros.</p></div><div class="queue"><div class="queue-item"><b>EXEMPLO</b><strong>Foto da saída</strong><span>Aguardaria conexão para envio</span></div><div class="queue-item"><b>EXEMPLO</b><strong>GPS e horário</strong><span>Aguardariam confirmação do servidor</span></div><div class="queue-item"><b>EXEMPLO</b><strong>Checklist da equipe</strong><span>Conflitos precisariam de reconciliação</span></div></div></div>`;
const views={home,operation,evidence,sync,stage:()=>stageScreen(stage)};document.querySelector("#content").innerHTML=(views[screen]||home)();document.querySelector(`[data-nav="${screen==="evidence"?"evidence":screen==="sync"?"sync":"home"}"]`).classList.add("active");document.head.insertAdjacentHTML("beforeend","<style>.action:disabled{background:#9b94c7;cursor:not-allowed}.mobile-web-nav{display:none}</style>");const updateProgress=()=>{const tasks=[...document.querySelectorAll(".task")],done=tasks.filter(item=>item.classList.contains("done")).length;document.querySelector(".progress i")?.style.setProperty("width",`${tasks.length?done/tasks.length*100:0}%`);const finish=document.querySelector("#finish");if(finish){finish.disabled=done!==tasks.length;finish.querySelector("span").textContent=finish.disabled?`${tasks.length-done} tarefa(s) pendente(s)`:"Tudo pronto · ação demonstrativa"}};document.querySelectorAll(".task button").forEach(button=>button.addEventListener("click",()=>{const task=button.closest(".task");task.classList.toggle("done");button.setAttribute("aria-pressed",String(task.classList.contains("done")));updateProgress()}));updateProgress();document.querySelectorAll("[data-demo]").forEach(button=>button.addEventListener("click",()=>{button.querySelector("strong").textContent=button.dataset.demo==="photo"?"Foto simulada":"GPS simulado";button.querySelector("span").textContent="Não foi salvo neste protótipo"}));document.querySelector("#finish")?.addEventListener("click",event=>event.currentTarget.querySelector("strong").textContent="Ação não enviada");
</script></body></html>
